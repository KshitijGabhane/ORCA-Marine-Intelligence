<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ORCA Registration</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #031923,
                    #062b3b,
                    #031923
                );

            color: white;

        }


        .register-box {

            width: 430px;

            padding: 35px;

            background: #082431;

            border: 1px solid #16465a;

            border-radius: 18px;

        }


        h1 {

            text-align: center;

            color: #18bfff;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #8caeba;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 7px;

        }


        input,
        select {

            width: 100%;

            padding: 13px;

            margin-bottom: 17px;

            border-radius: 8px;

            border: 1px solid #24566b;

            background: #061b27;

            color: white;

            font-size: 15px;

        }


        select option {

            background: #061b27;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0798d0;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .message {

            text-align: center;

            margin-top: 15px;

        }


        .login {

            text-align: center;

            margin-top: 20px;

            color: #8caeba;

        }


        .login a {

            color: #18bfff;

        }

    </style>

</head>


<body>


<div class="register-box">


    <h1>
        ORCA
    </h1>


    <div class="subtitle">
        Create Marine User Account
    </div>


    <form id="registerForm">


        <label>
            Full Name
        </label>


        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >


        <label>
            Email
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >


        <label>
            Account Type
        </label>


        <select
            id="role"
            required>

            <option value="">
                Select account type
            </option>

            <option value="Marine User">
                Fisherman / Marine User
            </option>

            <option value="rescue">
                Rescue Team
            </option>

        </select>


        <button type="submit">
            CREATE ACCOUNT
        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="login">

        Already have an account?

        <a href="/">
            Login
        </a>

    </div>


</div>


<script>

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const role =
            document
            .getElementById("role")
            .value;


        const message =
            document
            .getElementById("message");


        message.style.color =
            "#8caeba";

        message.textContent =
            "Creating account...";


        try {


            const response =
                await fetch(
                    "/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name:
                                name,

                            email:
                                email,

                            password:
                                password,

                            role:
                                role

                        })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                message.style.color =
                    "#ff7777";

                message.textContent =
                    data.message;

                return;

            }


            message.style.color =
                "#65d8a0";

            message.textContent =
                "Registration successful!";


            setTimeout(
                function() {

                    window.location.href =
                        "/";

                },
                1200
            );


        }

        catch(error) {

            console.error(error);

            message.style.color =
                "#ff7777";

            message.textContent =
                "Unable to connect to server.";

        }

    }
);

</script>


</body>

</html>
