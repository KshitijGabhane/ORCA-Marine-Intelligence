<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ORCA Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #031923,
                    #062b3b,
                    #031923
                );

            color: white;

        }


        .login-box {

            width: 400px;

            padding: 40px;

            background: #082431;

            border: 1px solid #16465a;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.4);

        }


        .logo {

            text-align: center;

            font-size: 48px;

            font-weight: bold;

            color: #18bfff;

            margin-bottom: 5px;

        }


        .subtitle {

            text-align: center;

            color: #8caeba;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #b9d0d9;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 8px;

            border: 1px solid #24566b;

            background: #061b27;

            color: white;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #18bfff;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #0798d0;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #08aceb;

        }


        .message {

            margin-top: 15px;

            text-align: center;

            color: #ff7777;

        }


        .register {

            text-align: center;

            margin-top: 22px;

            color: #8caeba;

        }


        .register a {

            color: #18bfff;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        ORCA
    </div>


    <div class="subtitle">
        Marine Intelligence & Safety
    </div>


    <form id="loginForm">


        <label>
            Email
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            LOGIN
        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="register">

        Don't have an account?

        <a href="/register">
            Register
        </a>

    </div>


</div>


<script>

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value;


        const password =
            document
            .getElementById("password")
            .value;


        const message =
            document
            .getElementById("message");


        message.style.color =
            "#8caeba";

        message.textContent =
            "Logging in...";


        try {


            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                message.style.color =
                    "#ff7777";

                message.textContent =
                    data.message;

                return;

            }


            // Flask session is already created.
            // No role is stored in localStorage.

            window.location.href =
                data.redirect;


        }

        catch(error) {

            console.error(error);

            message.style.color =
                "#ff7777";

            message.textContent =
                "Unable to connect to server.";

        }

    }
);

</script>


</body>

</html>
